<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Smash Zone AI</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/home.css">
    <style>
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-md);
            margin-bottom: 35px;
        }
        .cart-table th, .cart-table td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1.5px solid var(--border-dark);
        }
        .cart-table th {
            background: #fdfbf7;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cart-item-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 6px;
            border: 1.5px solid var(--border-dark);
            background: #f8f6f2;
            padding: 4px;
        }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            background: #ffffff;
            color: var(--text-main);
            border: 1.5px solid var(--border-dark);
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 1.5px 1.5px 0 var(--border-dark);
            transition: all 0.1s;
        }
        .qty-btn:hover {
            background: var(--brand-yellow);
            transform: translate(-1px, -1px);
        }
        .cart-summary {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-lg);
            max-width: 420px;
            margin-left: auto;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/index.html" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">SMASH <span>ZONE</span></span>
                <span class="logo-badge">AI CODE</span>
            </a>
            <nav class="nav-links">
                <a href="/index.html">Trang Chủ</a>
                <a href="/products.html">Sản Phẩm</a>
            </nav>
            <div class="user-actions">
                <a href="/cart.html" class="cart-icon">
                    🛒 <span class="cart-badge" id="cart-count">0</span>
                </a>
                <div id="user-nav"></div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 70px;">
        <div style="margin-bottom: 25px;">
            <span class="badge-pill badge-yellow">SHOPPING CART</span>
            <h1 style="font-size: 32px; text-transform: uppercase; margin-top: 8px;">Giỏ Hàng Của Bạn</h1>
        </div>

        <div id="cart-content">
            <p>Đang tải dữ liệu giỏ hàng...</p>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/auth/me')
                .then(res => res.json())
                .then(auth => {
                    if (!auth.authenticated || !auth.user) {
                        alert("⚠️ Vui lòng đăng nhập tài khoản để xem và quản lý giỏ hàng!");
                        window.location.href = '/login.html';
                        return;
                    }
                    loadCart();
                })
                .catch(() => loadCart());
        });

        function loadCart() {
            fetch('/api/cart')
                .then(res => res.json())
                .then(data => {
                    const content = document.getElementById('cart-content');
                    if (!data.items || data.items.length === 0) {
                        content.innerHTML = `
                            <div style="text-align: center; padding: 60px; background: #ffffff; border-radius: 12px; border: 2px solid var(--border-dark); box-shadow: var(--shadow-md);">
                                <p style="font-size: 20px; font-weight: 800; color: var(--text-muted); margin-bottom: 20px;">Giỏ hàng của bạn đang trống.</p>
                                <a href="/products.html" class="btn btn-primary" style="padding: 12px 28px;">Khám Phá Sản Phẩm Ngay ➔</a>
                            </div>
                        `;
                        return;
                    }

                    let rows = data.items.map(item => `
                        <tr>
                            <td>
                                <div style="display: flex; gap: 15px; align-items: center;">
                                    <img src="${item.image || 'https://images.unsplash.com/photo-1554080353-a576cf803bda?w=100'}" class="cart-item-img">
                                    <div>
                                        <strong style="font-size:15px;">${item.productName}</strong>
                                        <div style="font-size: 12px; color: var(--text-muted); font-weight:600;">Mã SP: #${item.productId}</div>
                                    </div>
                                </div>
                            </td>
                            <td style="font-weight:700;">${formatCurrency(item.unitPrice)}</td>
                            <td>
                                <div class="qty-control">
                                    <button class="qty-btn" onclick="updateQty(${item.productId}, ${item.quantity - 1})">-</button>
                                    <span style="font-weight:800; min-width:20px; text-align:center;">${item.quantity}</span>
                                    <button class="qty-btn" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td style="font-weight: 900; color: var(--brand-primary); font-size:16px;">${formatCurrency(item.totalPrice)}</td>
                            <td>
                                <button onclick="removeItem(${item.productId})" style="background: #fee2e2; border: 1.5px solid var(--border-dark); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; font-weight: bold;">🗑️ Xóa</button>
                            </td>
                        </tr>
                    `).join('');

                    content.innerHTML = `
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Đơn giá</th>
                                    <th>Số lượng</th>
                                    <th>Thành tiền</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>

                        <div class="cart-summary">
                            <h3 style="margin-bottom: 20px; text-transform: uppercase; font-size: 18px; border-bottom: 2px solid var(--border-dark); padding-bottom: 10px;">Tổng Đơn Hàng</h3>
                            <div class="summary-row">
                                <span>Tổng số lượng:</span>
                                <strong>${data.totalQuantity} sản phẩm</strong>
                            </div>
                            <div class="summary-row" style="font-size: 20px; padding-top: 10px; border-top: 1px dashed var(--border-dark);">
                                <span>Tổng thanh toán:</span>
                                <strong style="color: var(--brand-primary);">${formatCurrency(data.totalAmount)}</strong>
                            </div>
                            <a href="/checkout.html" class="btn btn-primary" style="display: block; text-align: center; padding: 14px; font-size: 16px; margin-top: 24px; width: 100%;">
                                TIẾN HÀNH THANH TOÁN ➔
                            </a>
                        </div>
                    `;
                });
        }

        function updateQty(productId, newQty) {
            fetch('/api/cart/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: productId, quantity: newQty })
            })
            .then(res => res.json())
            .then(() => {
                loadCart();
                updateCartCount();
            });
        }

        function removeItem(productId) {
            if (!confirm("Bạn có chắc chắn muốn xóa sản phẩm này khỏi giỏ hàng?")) return;
            fetch('/api/cart/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: productId })
            })
            .then(res => res.json())
            .then(() => {
                loadCart();
                updateCartCount();
            });
        }
    </script>
</body>
</html>

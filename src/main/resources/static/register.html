<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Smash Zone AI</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 45px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-xl);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 25px;">
            <a href="/index.html" class="logo" style="justify-content: center; margin-bottom: 12px;">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">SMASH <span>ZONE</span></span>
                <span class="logo-badge">AI CODE</span>
            </a>
            <h2 style="margin-top: 15px; text-transform: uppercase;">Đăng Ký Tài Khoản</h2>
        </div>

        <div id="error-box" class="error-msg"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Tên đăng nhập (*)</label>
                <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập từ 3 ký tự..." required>
            </div>
            <div class="form-group">
                <label>Mật khẩu (*)</label>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu ít nhất 6 ký tự..." required>
            </div>
            <div class="form-group">
                <label>Họ và tên (*)</label>
                <input type="text" id="fullName" class="form-control" placeholder="Họ và tên đầy đủ..." required>
            </div>
            <div class="form-group">
                <label>Email (*)</label>
                <input type="email" id="email" class="form-control" placeholder="email@example.com..." required>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phoneNumber" class="form-control" placeholder="0987...">
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" id="address" class="form-control" placeholder="Địa chỉ giao hàng...">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; margin-top: 10px;">
                TẠO TÀI KHOẢN NGAY ➔
            </button>
        </form>

        <p style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted);">
            Đã có tài khoản? <a href="/login.html" style="color: var(--brand-primary); font-weight: 800; text-decoration: underline;">Đăng nhập ngay</a>
        </p>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const user = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                address: document.getElementById('address').value
            };

            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("🎉 " + data.message);
                    window.location.href = '/login.html';
                } else {
                    errorBox.textContent = data.message || 'Đăng ký thất bại';
                    errorBox.style.display = 'block';
                }
            })
            .catch(err => {
                errorBox.textContent = 'Lỗi kết nối server!';
                errorBox.style.display = 'block';
            });
        }
    </script>
</body>
</html>

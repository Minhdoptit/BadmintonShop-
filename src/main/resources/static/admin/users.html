<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - Admin Smash Zone</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <style>
        .admin-nav { display: flex; gap: 15px; margin-bottom: 30px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
        .admin-nav a { color: var(--text-muted); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; }
        .admin-nav a.active, .admin-nav a:hover { background: var(--primary-cyan); color: #000; font-weight: bold; }
        .table-card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">SMASH <span>ZONE ADMIN</span></span></a>
            <div class="user-actions"><a href="/index.html" class="btn btn-secondary">Trang Chủ</a></div>
        </div>
    </header>

    <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
        <nav class="admin-nav">
            <a href="/admin/dashboard.html">📊 Thống Kê Dashboard</a>
            <a href="/admin/products.html">📦 Quản Lý Sản Phẩm</a>
            <a href="/admin/orders.html">🛒 Quản Lý Đơn Hàng</a>
            <a href="/admin/users.html" class="active">👥 Quản Lý Người Dùng</a>
        </nav>

        <h2 style="margin-bottom: 20px;">Danh Sách Khách Hàng</h2>

        <div class="table-card">
            <table style="width:100%; border-collapse:collapse;" id="users-table">
                <thead>
                    <tr style="border-bottom:1px solid #334155; text-align:left; color:var(--text-muted); font-size:13px;">
                        <th style="padding:10px;">ID</th>
                        <th style="padding:10px;">Username</th>
                        <th style="padding:10px;">Họ & Tên</th>
                        <th style="padding:10px;">Email</th>
                        <th style="padding:10px;">SĐT</th>
                        <th style="padding:10px;">Trạng Thái</th>
                        <th style="padding:10px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadUsers);

        function loadUsers() {
            fetch('/api/admin/users')
                .then(res => res.json())
                .then(users => {
                    if (users.error) {
                        alert(users.error);
                        window.location.href = '/index.html';
                        return;
                    }
                    const tbody = document.querySelector('#users-table tbody');
                    tbody.innerHTML = users.map(u => `
                        <tr style="border-bottom:1px solid #334155; font-size:14px;">
                            <td style="padding:10px;">#${u.userId}</td>
                            <td style="padding:10px;"><strong>${u.username}</strong></td>
                            <td style="padding:10px;">${u.fullName || ''}</td>
                            <td style="padding:10px; color:var(--text-muted);">${u.email || ''}</td>
                            <td style="padding:10px;">${u.phoneNumber || ''}</td>
                            <td style="padding:10px;">
                                <span style="background:${u.role === 'DISABLED' ? 'rgba(239,68,68,0.15)' : 'rgba(34,197,94,0.15)'}; color:${u.role === 'DISABLED' ? '#ef4444' : '#22c55e'}; padding:3px 10px; border-radius:12px;">
                                    ${u.role === 'DISABLED' ? 'Đã khóa' : 'Hoạt động'}
                                </span>
                            </td>
                            <td style="padding:10px;">
                                <button onclick="toggleUserStatus(${u.userId}, ${u.role === 'DISABLED' ? 1 : 0})" 
                                        style="background:${u.role === 'DISABLED' ? '#22c55e' : '#ef4444'}; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">
                                    ${u.role === 'DISABLED' ? 'Mở Khóa' : 'Khóa'}
                                </button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function toggleUserStatus(userId, newStatus) {
            fetch('/api/admin/users/' + userId + '/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadUsers();
            });
        }
    </script>
</body>
</html>

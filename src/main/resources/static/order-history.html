<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đơn Hàng - Smash Zone AI</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/home.css">
    <style>
        .order-card {
            background: #ffffff;
            border: 2px solid var(--border-dark);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.15s ease;
        }
        .order-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translate(-1px, -1px);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid var(--border-dark);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/index.html" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">SMASH <span>ZONE</span></span>
                <span class="logo-badge">AI CODE</span>
            </a>
            <nav class="nav-links">
                <a href="/index.html">Trang Chủ</a>
                <a href="/products.html">Sản Phẩm</a>
            </nav>
            <div class="user-actions">
                <a href="/cart.html" class="cart-icon">🛒 <span class="cart-badge" id="cart-count">0</span></a>
                <div id="user-nav"></div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 70px;">
        <div style="margin-bottom: 25px;">
            <span class="badge-pill badge-yellow">ORDER HISTORY</span>
            <h1 style="font-size: 32px; text-transform: uppercase; margin-top: 8px;">Lịch Sử Đơn Hàng Của Bạn</h1>
        </div>

        <div id="orders-list">
            <p>Đang nạp lịch sử đơn hàng...</p>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/orders/my-orders')
                .then(res => res.json())
                .then(orders => {
                    const list = document.getElementById('orders-list');
                    if (!orders || orders.length === 0) {
                        list.innerHTML = `
                            <div style="text-align: center; padding: 60px; background: #fff; border: 2px solid var(--border-dark); border-radius: 12px; box-shadow: var(--shadow-md);">
                                <p style="font-size: 18px; font-weight: 700; color: var(--text-muted); margin-bottom: 16px;">Bạn chưa có đơn hàng nào.</p>
                                <a href="/products.html" class="btn btn-primary">Mua Sắm Ngay ➔</a>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = orders.map(o => {
                        const oId = o.id || o.orderId;
                        const items = o.orderDetails || o.items || [];
                        const itemsHtml = items.map(it => `
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                                <span><strong>${it.productName || ('Sản phẩm #' + it.productId)}</strong> x${it.quantity}</span>
                                <span style="font-weight:700;">${formatCurrency(it.unitPrice || it.price)}</span>
                            </div>
                        `).join('');

                        let badgeColor = 'badge-yellow';
                        if (o.status === 'DELIVERED' || o.status === 'COMPLETED') badgeColor = 'badge-green';
                        if (o.status === 'CANCELLED') badgeColor = 'badge-red';

                        return `
                            <div class="order-card">
                                <div class="order-header">
                                    <div>
                                        <strong style="font-size:16px;">Đơn hàng #${oId}</strong>
                                        <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">Ngày đặt: ${o.createdAt || ''}</div>
                                    </div>
                                    <span class="badge-pill ${badgeColor}">${o.status}</span>
                                </div>
                                <div style="margin-bottom: 16px;">
                                    ${itemsHtml}
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border-dark); padding-top:14px;">
                                    <span style="font-size:13px; color:var(--text-muted);">Giao tới: <strong>${o.shippingAddress || o.deliveryAddress || 'Tại cửa hàng'}</strong></span>
                                    <div>
                                        <span style="font-size:14px;">Tổng cộng: </span>
                                        <strong style="color:var(--brand-primary); font-size:18px;">${formatCurrency(o.totalAmount)}</strong>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                })
                .catch(err => {
                    console.error("Lỗi khi tải đơn hàng:", err);
                });
        });
    </script>
</body>
</html>
